[build]
  # Tell Netlify to execute commands inside the docs/ directory
  base = "docs"
  
  # Path to rendered output relative to repo root
  publish = "docs/_site"
  
  # Command to build the site inside the base directory
  command = "quarto render"

[[plugins]]
  # Plugin to install and configure Quarto on Netlify's build server
  package = "netlify-plugin-quarto"
  